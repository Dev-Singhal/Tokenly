<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  :root{
    --primary:#E52C65; --bg:#212121; --surface:#2A2A2A; --surface-2:#333333;
    --ink:#F2F1F6; --muted:#9C98A8; --line:#3D3D3D;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:-apple-system,'Segoe UI',sans-serif; font-size:12.5px; color:var(--ink); background:var(--bg); }
  .tabs{ display:flex; overflow-x:auto; border-bottom:1px solid var(--line); background:var(--surface); position:sticky; top:0; z-index:2; }
  .tab{ padding:10px 12px; font-size:11.5px; font-weight:600; color:var(--muted); cursor:pointer; white-space:nowrap; border-bottom:2px solid transparent; }
  .tab.active{ color:var(--ink); border-bottom-color:var(--primary); }
  .panel{ padding:16px; }
  label.field{ display:block; margin-bottom:12px; }
  .field-label{ font-size:10.5px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:0.03em; margin-bottom:5px; }
  input[type=text], input[type=number], select{ width:100%; padding:7px 9px; border-radius:7px; border:1.5px solid var(--line); font-size:12px; font-family:inherit; background:var(--surface-2); color:var(--ink); }
  input[type=text]:focus, input[type=number]:focus, select:focus{ outline:none; border-color:var(--primary); }
  input[type=color]{ width:36px; height:30px; border:1.5px solid var(--line); border-radius:6px; padding:0; background:var(--surface-2); }
  .row{ display:flex; gap:10px; align-items:flex-end; }
  .row > div{ flex:1; }
  button.primary{
    position:relative; padding:10px 22px; background:var(--primary); font-size:12.5px; font-weight:700;
    color:white; border:2px solid #FF6F97; border-radius:8px; box-shadow:0 0 0 rgba(255,111,151,0);
    transition:all 0.3s ease-in-out; cursor:pointer; margin-top:6px; overflow:visible;
  }
  button.primary:hover{ background:transparent; color:#FF6F97; box-shadow:0 0 20px #FF6F97; }
  .star-1,.star-2,.star-3,.star-4,.star-5,.star-6{ position:absolute; z-index:-5; filter:drop-shadow(0 0 0 #fffdef); }
  .star-1{ top:20%; left:20%; width:18px; transition:all 1s cubic-bezier(0.05,0.83,0.43,0.96); }
  .star-2{ top:45%; left:45%; width:11px; transition:all 1s cubic-bezier(0,0.4,0,1.01); }
  .star-3{ top:40%; left:40%; width:4px; transition:all 1s cubic-bezier(0,0.4,0,1.01); }
  .star-4{ top:20%; left:40%; width:6px; transition:all 0.8s cubic-bezier(0,0.4,0,1.01); }
  .star-5{ top:25%; left:45%; width:11px; transition:all 0.6s cubic-bezier(0,0.4,0,1.01); }
  .star-6{ top:5%; left:50%; width:4px; transition:all 0.8s ease; }
  button.primary:hover .star-1{ top:-80%; left:-30%; filter:drop-shadow(0 0 10px #fffdef); z-index:2; }
  button.primary:hover .star-2{ top:-25%; left:10%; filter:drop-shadow(0 0 10px #fffdef); z-index:2; }
  button.primary:hover .star-3{ top:55%; left:25%; filter:drop-shadow(0 0 10px #fffdef); z-index:2; }
  button.primary:hover .star-4{ top:30%; left:80%; filter:drop-shadow(0 0 10px #fffdef); z-index:2; }
  button.primary:hover .star-5{ top:25%; left:115%; filter:drop-shadow(0 0 10px #fffdef); z-index:2; }
  button.primary:hover .star-6{ top:5%; left:60%; filter:drop-shadow(0 0 10px #fffdef); z-index:2; }
  .fil0{ fill:#fffdef; }
  .status{ font-size:11px; color:var(--muted); margin-top:8px; min-height:14px; }
  .status.ok{ color:#4ADE80; } .status.err{ color:#F87171; }
  .swatch-row{ display:grid; grid-template-columns:repeat(5,1fr); gap:6px; margin-bottom:14px; }
  .swatch{ height:44px; border-radius:6px; display:flex; align-items:flex-end; padding:4px; font-size:9px; font-weight:700; color:white; cursor:pointer; }
  .section-label{ font-size:10px; color:var(--muted); text-transform:uppercase; margin:14px 0 6px; font-weight:600; }
  .type-row{ border-bottom:1px solid var(--line); padding:9px 0; }
  .type-row-top{ display:flex; justify-content:space-between; align-items:baseline; cursor:pointer; }
  .override-box{ background:var(--surface); border-radius:7px; padding:10px; margin-top:8px; grid-template-columns:1fr 1fr; gap:8px; }
  .comp-card{ border:1px solid var(--line); border-radius:10px; padding:12px; margin-bottom:10px; background:var(--surface); }
  .comp-card-head{ display:flex; align-items:center; gap:8px; font-weight:600; font-size:12.5px; margin-bottom:6px; }
  .checkbox-row{ display:flex; align-items:center; gap:8px; margin-bottom:10px; }
  .plugin-header{ display:flex; align-items:center; gap:8px; padding:12px 16px; border-bottom:1px solid var(--line); background:var(--surface); }
  .plugin-header img{ width:22px; height:22px; border-radius:6px; }
  .plugin-header span{ font-size:13px; font-weight:600; letter-spacing:-0.01em; }
  .btn-add{ display:block; width:100%; background:transparent; border:1.5px dashed var(--line); color:var(--muted); padding:8px 14px; border-radius:8px; font-size:11.5px; font-weight:600; cursor:pointer; margin-top:6px; }
  .btn-add:hover{ border-color:var(--primary); color:var(--primary); }
  .extra-color-remove{ float:right; cursor:pointer; color:var(--muted); font-weight:600; text-transform:none; letter-spacing:0; }
  .extra-color-remove:hover{ color:#F87171; }
</style>
</head>

  <span>Tokenly</span>
</div>
<div class="tabs" id="tabs"></div>
<div id="panels"></div>

<script>
/* ============== helpers (color / scale math) ============== */
function hexToRgb(hex){
  const h = hex.replace('#','');
  const full = h.length===3 ? h.split('').map(c=>c+c).join('') : h;
  const num = parseInt(full,16);
  return { r:(num>>16)&255, g:(num>>8)&255, b:num&255 };
}
function rgbToHex(r,g,b){
  return '#'+[r,g,b].map(v=>Math.round(Math.max(0,Math.min(255,v))).toString(16).padStart(2,'0')).join('').toUpperCase();
}
function mix(hex,target,factor){
  const a=hexToRgb(hex), b=hexToRgb(target);
  return rgbToHex(a.r+(b.r-a.r)*factor, a.g+(b.g-a.g)*factor, a.b+(b.b-a.b)*factor);
}
function buildScale(base){
  const steps=[50,100,200,300,400,500,600,700,800,900];
  const tint={50:0.95,100:0.88,200:0.74,300:0.58,400:0.32,500:0.14};
  const shade={700:0.15,800:0.34,900:0.52};
  const out={};
  steps.forEach(s=>{
    if(s===600) out[s]=base;
    else if(tint[s]!==undefined) out[s]=mix(base,'#FFFFFF',tint[s]);
    else out[s]=mix(base,'#000000',shade[s]);
  });
  return out;
}
function autoGrey(primaryHex){
  const {r,g,b}=hexToRgb(primaryHex);
  const grey=(r+g+b)/3, blend=0.08;
  return rgbToHex(grey*(1-blend)+r*blend, grey*(1-blend)+g*blend, grey*(1-blend)+b*blend);
}
const RATIOS = { 'minor-second':1.067,'major-second':1.125,'minor-third':1.2,'major-third':1.25,'perfect-fourth':1.333,'golden':1.618 };
const ROLES = ['caption','body','body-lg','h3','h2','h1','display'];
const ROLE_INDEX = { caption:-1, body:0, 'body-lg':1, h3:2, h2:3, h1:4, display:5 };
const RADIUS_PREVIEW_SIZE = 44;
const STAR_SVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 784.11 815.53"><path class="fil0" d="M392.05 0c-20.9,210.08 -184.06,378.41 -392.05,407.78 207.96,29.37 371.12,197.68 392.05,407.74 20.93,-210.06 184.09,-378.37 392.05,-407.74 -207.98,-29.38 -371.16,-197.69 -392.06,-407.78z"></path></svg>`;
function sparkleButton(label, onclickJS){
  return `<button class="primary" onclick="${onclickJS}">
    ${label}
    <div class="star-1">${STAR_SVG}</div>
    <div class="star-2">${STAR_SVG}</div>
    <div class="star-3">${STAR_SVG}</div>
    <div class="star-4">${STAR_SVG}</div>
    <div class="star-5">${STAR_SVG}</div>
    <div class="star-6">${STAR_SVG}</div>
  </button>`;
}

/* ============== state ============== */
let state = {
  color: { primary:'#E52C65', useSecondary:true, secondary:'#7524B7', useCustomGrey:false, grey500:'#7D7796', extras:[] },
  typography: { font:'Satoshi', scaleType:'major-third', customRatio:1.25, bodySize:16, overrides:{} },
  spacing: { base:8, customBase:8, scaleType:'linear', ratio:1.5, steps:8 },
  radius: { min:4, max:24, steps:4, scaleType:'linear' },
  shadow: { enabled:true, steps:3, intensity:0.12, tint:'neutral' },
  components: {
    button:{ include:true, variants:'Primary, Secondary, Outline, Ghost, Destructive' },
    input:{ include:true },
    toggle:{ include:true },
    checkbox:{ include:true },
    radio:{ include:true },
    tabs:{ include:true },
    badge:{ include:true, variants:'Primary, Secondary, Success, Warning, Error, Neutral' },
  }
};
let expandedRole = null;
let currentTab = 'Color';

function computeTokens(){
  const primaryScale = buildScale(state.color.primary);
  const secondaryScale = state.color.useSecondary ? buildScale(state.color.secondary) : null;
  const greyBase = state.color.useCustomGrey ? state.color.grey500 : autoGrey(state.color.primary);
  const greyScale = buildScale(greyBase);

  const ratio = state.typography.scaleType==='custom' ? state.typography.customRatio : RATIOS[state.typography.scaleType];
  const typeScale = {};
  ROLES.forEach(role=>{
    const size = Math.round(state.typography.bodySize * Math.pow(ratio, ROLE_INDEX[role]));
    const ov = state.typography.overrides[role] || {};
    typeScale[role] = {
      size,
      weight: ov.weight !== undefined ? ov.weight : (ROLE_INDEX[role]>=3?700:ROLE_INDEX[role]>=5?900:400),
      letterSpacing: ov.letterSpacing !== undefined ? ov.letterSpacing : (ROLE_INDEX[role]>=2?-0.02:0),
      lineHeight: ov.lineHeight !== undefined ? ov.lineHeight : (ROLE_INDEX[role]>=2?1.15:1.5),
      font: ov.font || state.typography.font,
    };
  });

  const base = state.spacing.base==='custom' ? state.spacing.customBase : state.spacing.base;
  const spacingScale=[];
  for(let i=1;i<=state.spacing.steps;i++){
    spacingScale.push(state.spacing.scaleType==='linear' ? base*i : Math.round(base*Math.pow(state.spacing.ratio,i-1)));
  }

  const radiusScale=[];
  for(let i=0;i<state.radius.steps;i++){
    const t = state.radius.steps===1 ? 0 : i/(state.radius.steps-1);
    const v = state.radius.scaleType==='linear'
      ? state.radius.min + (state.radius.max-state.radius.min)*t
      : state.radius.min * Math.pow(state.radius.max/state.radius.min, t);
    radiusScale.push(Math.round(v));
  }

  let shadowScale=[];
  if(state.shadow.enabled){
    const tintColor = state.shadow.tint==='primary' ? state.color.primary : '#18161F';
    const rgb = hexToRgb(tintColor);
    for(let i=1;i<=state.shadow.steps;i++){
      const blur=6*i*i, y=2*i*i, alpha=(state.shadow.intensity/i*1.4);
      shadowScale.push(`0 ${y}px ${blur}px rgba(${rgb.r},${rgb.g},${rgb.b},${alpha.toFixed(2)})`);
    }
  }

  return {
    color:{ primary:primaryScale, secondary:secondaryScale, grey:greyScale, extras: state.color.extras.map(e => ({ name: e.name, scale: buildScale(e.hex) })) },
    typography:{ font:state.typography.font, scale:typeScale },
    spacing:spacingScale, radius:radiusScale, shadow:shadowScale,
    components: state.components,
  };
}

/* ============== tabs scaffold ============== */
const TABS = ['Color','Typography','Spacing','Radius','Shadow','Components'];
const tabsEl = document.getElementById('tabs');
const panelsEl = document.getElementById('panels');
TABS.forEach(t=>{
  const tab=document.createElement('div');
  tab.className='tab'+(t===currentTab?' active':'');
  tab.textContent=t; tab.dataset.tab=t;
  tab.onclick=()=>{ currentTab=t; renderTabs(); renderCurrentTab(); };
  tabsEl.appendChild(tab);
});
function renderTabs(){
  document.querySelectorAll('.tab').forEach(el=>el.classList.toggle('active', el.dataset.tab===currentTab));
}

function publish(type){
  const tokens = computeTokens();
  parent.postMessage({ pluginMessage: { type, tokens } }, '*');
  setStatus(currentTab, 'Publishing…');
}
function setStatus(tabName, text, kind){
  const el = document.getElementById('status-'+tabName);
  if(!el) return;
  el.textContent=text; el.className='status'+(kind?' '+kind:'');
}

/* ============== dispatcher — only called on tab switch or a discrete (checkbox/select) change ============== */
function renderCurrentTab(){
  if(currentTab==='Color'){ panelsEl.innerHTML = `<div class="panel">${colorControlsHTML()}</div>`; updateColorPreview(); }
  if(currentTab==='Typography'){ panelsEl.innerHTML = `<div class="panel">${typographyControlsHTML()}</div>`; }
  if(currentTab==='Spacing'){ panelsEl.innerHTML = `<div class="panel">${spacingControlsHTML()}</div>`; updateSpacingPreview(); }
  if(currentTab==='Radius'){ panelsEl.innerHTML = `<div class="panel">${radiusControlsHTML()}</div>`; updateRadiusPreview(); }
  if(currentTab==='Shadow'){ panelsEl.innerHTML = `<div class="panel">${shadowControlsHTML()}</div>`; if(state.shadow.enabled) updateShadowPreview(); }
  if(currentTab==='Components'){ panelsEl.innerHTML = `<div class="panel">${componentsControlsHTML()}</div>`; }
}

/* ============== Color tab ============== */
function colorControlsHTML(){
  return `
    <div class="field-label">Primary</div>
    <div class="row">
      <div><input id="primary-color-picker" type="color" value="${state.color.primary}" oninput="onColorPickerInput('primary', this.value)"></div>
      <div><input id="primary-hex-input" type="text" value="${state.color.primary}" oninput="onHexInput('primary', this.value)"></div>
    </div>
    <div class="checkbox-row" style="margin-top:14px;"><input type="checkbox" ${state.color.useSecondary?'checked':''} onchange="state.color.useSecondary=this.checked; renderCurrentTab()"> <span class="field-label" style="margin:0;">Secondary (optional)</span></div>
    ${state.color.useSecondary ? `<div class="row">
      <div><input id="secondary-color-picker" type="color" value="${state.color.secondary}" oninput="onColorPickerInput('secondary', this.value)"></div>
      <div><input id="secondary-hex-input" type="text" value="${state.color.secondary}" oninput="onHexInput('secondary', this.value)"></div>
    </div>` : ''}
    <div class="checkbox-row" style="margin-top:14px;"><input type="checkbox" ${state.color.useCustomGrey?'checked':''} onchange="state.color.useCustomGrey=this.checked; renderCurrentTab()"> <span class="field-label" style="margin:0;">Custom grey-500 (optional)</span></div>
    ${state.color.useCustomGrey ? `<div class="row">
      <div><input id="grey-color-picker" type="color" value="${state.color.grey500}" oninput="onColorPickerInput('grey', this.value)"></div>
      <div><input id="grey-hex-input" type="text" value="${state.color.grey500}" oninput="onHexInput('grey', this.value)"></div>
    </div>` : ''}
    ${state.color.extras.map(e => `
      <div class="field-label" style="margin-top:14px;">${escapeHtml(e.name)} <span class="extra-color-remove" onclick="removeExtraColor('${e.id}')">remove</span></div>
      <input type="text" value="${escapeHtml(e.name)}" oninput="onExtraNameInput('${e.id}', this.value)" style="width:100%; padding:6px 9px; border-radius:6px; border:1.5px solid var(--line); background:var(--surface-2); color:var(--ink); font-size:11.5px; margin-bottom:8px;" placeholder="Color name">
      <div class="row">
        <div><input id="extra-picker-${e.id}" type="color" value="${e.hex}" oninput="onExtraColorPickerInput('${e.id}', this.value)"></div>
        <div><input id="extra-hex-${e.id}" type="text" value="${e.hex}" oninput="onExtraHexInput('${e.id}', this.value)"></div>
      </div>
    `).join('')}
    <button type="button" class="btn-add" onclick="addExtraColor()">+ Add color</button>
    <div id="color-preview"></div>
    ${sparkleButton('Publish color styles', "publish('publish-colors')")}
    <div class="status" id="status-Color"></div>
  `;
}
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function addExtraColor(){
  const id = 'c'+Date.now();
  state.color.extras.push({ id, name:'Color '+(state.color.extras.length+1), hex:'#888888' });
  renderCurrentTab();
}
function removeExtraColor(id){
  state.color.extras = state.color.extras.filter(e=>e.id!==id);
  renderCurrentTab();
}
function onExtraNameInput(id, value){
  const item = state.color.extras.find(e=>e.id===id);
  if(item) item.name = value;
  updateColorPreview();
}
function onExtraColorPickerInput(id, value){
  const item = state.color.extras.find(e=>e.id===id);
  if(item) item.hex = value;
  const hexEl = document.getElementById('extra-hex-'+id);
  if(hexEl) hexEl.value = value.toUpperCase();
  updateColorPreview();
}
function onExtraHexInput(id, value){
  const item = state.color.extras.find(e=>e.id===id);
  if(item) item.hex = value;
  if(/^#[0-9A-Fa-f]{6}$/.test(value)){
    const pickerEl = document.getElementById('extra-picker-'+id);
    if(pickerEl) pickerEl.value = value;
  }
  updateColorPreview();
}
function colorPreviewHTML(t){
  const scaleHtml=(label,scale)=>`
    <div class="section-label">${label}</div>
    <div class="swatch-row">${Object.entries(scale).map(([step,hex])=>`<div class="swatch" style="background:${hex}" onclick="navigator.clipboard.writeText('${hex}')">${step}</div>`).join('')}</div>`;
  let html = scaleHtml('Primary scale', t.color.primary);
  if(t.color.secondary) html += scaleHtml('Secondary scale', t.color.secondary);
  // grey scale swatches only render once the user opts into a custom grey — otherwise just a
  // one-line note, since showing a full auto-derived scale nobody asked to see was noise.
  if(state.color.useCustomGrey){
    html += scaleHtml('Grey scale', t.color.grey);
  } else {
    html += `<div class="section-label">Grey</div><div style="font-size:10.5px; color:var(--muted); margin-bottom:10px;">auto-derived: ${t.color.grey['600']} — enable custom grey above to preview its full scale</div>`;
  }
  t.color.extras.forEach(e => { html += scaleHtml(escapeHtml(e.name)+' scale', e.scale); });
  return html;
}
function updateColorPreview(){
  const el = document.getElementById('color-preview');
  if(el) el.innerHTML = colorPreviewHTML(computeTokens());
}
// oninput handlers update state + only the paired field/preview — never touch the input elements themselves,
// which is what was closing the native color picker and stealing focus from the hex field mid-keystroke.
function onColorPickerInput(which, value){
  if(which==='primary') state.color.primary=value;
  else if(which==='secondary') state.color.secondary=value;
  else if(which==='grey') state.color.grey500=value;
  const hexEl = document.getElementById(which+'-hex-input');
  if(hexEl) hexEl.value = value.toUpperCase();
  updateColorPreview();
}
function onHexInput(which, value){
  if(which==='primary') state.color.primary=value;
  else if(which==='secondary') state.color.secondary=value;
  else if(which==='grey') state.color.grey500=value;
  if(/^#[0-9A-Fa-f]{6}$/.test(value)){
    const pickerEl = document.getElementById(which+'-color-picker');
    if(pickerEl) pickerEl.value = value;
  }
  updateColorPreview();
}

/* ============== Typography tab ============== */
function typographyControlsHTML(){
  const t = computeTokens();
  const rows = ROLES.slice().reverse().map(role=>{
    const s = t.typography.scale[role];
    return `
      <div class="type-row">
        <div class="type-row-top" onclick="toggleRole('${role}')">
          <span id="sample-${role}" style="font-size:${Math.min(s.size,22)}px; font-weight:${s.weight}; letter-spacing:${s.letterSpacing}em; line-height:${s.lineHeight};">${role}</span>
          <span id="meta-${role}" style="font-size:9.5px; color:var(--muted); font-family:monospace;">${s.size}px / ${s.weight}</span>
        </div>
        <div class="override-box" id="override-${role}" style="display:${expandedRole===role?'grid':'none'};">
          <label class="field"><span class="field-label">Weight</span><input type="number" step="100" value="${s.weight}" oninput="setOverride('${role}','weight',parseInt(this.value))"></label>
          <label class="field"><span class="field-label">Letter spacing</span><input type="number" step="0.005" value="${s.letterSpacing}" oninput="setOverride('${role}','letterSpacing',parseFloat(this.value))"></label>
          <label class="field"><span class="field-label">Line height</span><input type="number" step="0.05" value="${s.lineHeight}" oninput="setOverride('${role}','lineHeight',parseFloat(this.value))"></label>
          <label class="field"><span class="field-label">Font</span><input type="text" value="${s.font}" oninput="setOverride('${role}','font',this.value)"></label>
        </div>
      </div>`;
  }).join('');
  return `
    <label class="field"><span class="field-label">Typeface</span><input type="text" value="${state.typography.font}" oninput="state.typography.font=this.value; updateTypographyPreview()"></label>
    <div class="row">
      <div><label class="field"><span class="field-label">Scale</span>
        <select onchange="state.typography.scaleType=this.value; renderCurrentTab()">
          ${['minor-second','major-second','minor-third','major-third','perfect-fourth','golden','custom'].map(v=>`<option value="${v}" ${state.typography.scaleType===v?'selected':''}>${v}</option>`).join('')}
        </select>
      </label></div>
      <div><label class="field"><span class="field-label">Body size (px)</span><input type="number" value="${state.typography.bodySize}" oninput="state.typography.bodySize=parseInt(this.value)||16; updateTypographyPreview()"></label></div>
    </div>
    ${state.typography.scaleType==='custom' ? `<label class="field"><span class="field-label">Custom ratio</span><input type="number" step="0.01" value="${state.typography.customRatio}" oninput="state.typography.customRatio=parseFloat(this.value); updateTypographyPreview()"></label>` : ''}
    <div class="section-label">Scale preview — click a row to override</div>
    ${rows}
    ${sparkleButton('Publish text styles', "publish('publish-typography')")}
    <div class="status" id="status-Typography"></div>
  `;
}
function toggleRole(role){
  expandedRole = expandedRole===role ? null : role;
  ROLES.forEach(r=>{
    const box = document.getElementById('override-'+r);
    if(box) box.style.display = (expandedRole===r) ? 'grid' : 'none';
  });
}
function setOverride(role,key,value){
  state.typography.overrides[role] = Object.assign({}, state.typography.overrides[role]||{}, {[key]:value});
  updateTypographyPreview();
}
function updateTypographyPreview(){
  const t = computeTokens();
  ROLES.forEach(role=>{
    const s = t.typography.scale[role];
    const sampleEl = document.getElementById('sample-'+role);
    const metaEl = document.getElementById('meta-'+role);
    if(sampleEl){
      sampleEl.style.fontSize = Math.min(s.size,22)+'px';
      sampleEl.style.fontWeight = s.weight;
      sampleEl.style.letterSpacing = s.letterSpacing+'em';
      sampleEl.style.lineHeight = s.lineHeight;
    }
    if(metaEl) metaEl.textContent = s.size+'px / '+s.weight;
  });
}

/* ============== Spacing tab ============== */
function spacingControlsHTML(){
  return `
    <div class="row">
      <div><label class="field"><span class="field-label">Base unit</span>
        <select onchange="state.spacing.base=this.value==='custom'?'custom':parseInt(this.value); renderCurrentTab()">
          <option value="4" ${state.spacing.base===4?'selected':''}>4px</option>
          <option value="8" ${state.spacing.base===8?'selected':''}>8px</option>
          <option value="custom" ${state.spacing.base==='custom'?'selected':''}>Custom</option>
        </select>
      </label></div>
      <div><label class="field"><span class="field-label">Scale type</span>
        <select onchange="state.spacing.scaleType=this.value; renderCurrentTab()">
          <option value="linear" ${state.spacing.scaleType==='linear'?'selected':''}>Linear</option>
          <option value="geometric" ${state.spacing.scaleType==='geometric'?'selected':''}>Geometric</option>
        </select>
      </label></div>
      <div><label class="field"><span class="field-label">Steps</span><input type="number" value="${state.spacing.steps}" oninput="state.spacing.steps=parseInt(this.value)||1; updateSpacingPreview()"></label></div>
    </div>
    ${state.spacing.base==='custom' ? `<label class="field"><span class="field-label">Custom base (px)</span><input type="number" value="${state.spacing.customBase}" oninput="state.spacing.customBase=parseInt(this.value)||1; updateSpacingPreview()"></label>` : ''}
    ${state.spacing.scaleType==='geometric' ? `<label class="field"><span class="field-label">Ratio</span><input type="number" step="0.1" value="${state.spacing.ratio}" oninput="state.spacing.ratio=parseFloat(this.value); updateSpacingPreview()"></label>` : ''}
    <div class="section-label">Preview</div>
    <div id="spacing-preview"></div>
    ${sparkleButton('Publish spacing variables', "publish('publish-spacing')")}
    <div class="status" id="status-Spacing"></div>
  `;
}
function spacingPreviewHTML(t){
  // flex:0 0 auto here overrides the ".row > div{flex:1}" rule that was stretching every bar
  // to the same full width regardless of its actual px value.
  return t.spacing.map((v,i)=>`
    <div class="row" style="align-items:center; margin-bottom:6px;">
      <span style="width:44px; font-size:10px; font-family:monospace; flex:0 0 auto;">sp-${i+1}</span>
      <div style="height:10px; background:${t.color.primary['600']}; width:${v}px; border-radius:3px; flex:0 0 auto;"></div>
      <span style="font-size:10px; color:var(--muted); width:40px; flex:0 0 auto;">${v}px</span>
    </div>`).join('');
}
function updateSpacingPreview(){
  const el = document.getElementById('spacing-preview');
  if(el) el.innerHTML = spacingPreviewHTML(computeTokens());
}

/* ============== Radius tab ============== */
function radiusControlsHTML(){
  return `
    <div class="row">
      <div><label class="field"><span class="field-label">Min (px)</span><input type="number" value="${state.radius.min}" oninput="state.radius.min=parseInt(this.value)||0; updateRadiusPreview()"></label></div>
      <div><label class="field"><span class="field-label">Max (px)</span><input type="number" value="${state.radius.max}" oninput="state.radius.max=parseInt(this.value)||0; updateRadiusPreview()"></label></div>
    </div>
    <div class="row">
      <div><label class="field"><span class="field-label">Steps</span><input type="number" value="${state.radius.steps}" oninput="state.radius.steps=parseInt(this.value)||1; updateRadiusPreview()"></label></div>
      <div><label class="field"><span class="field-label">Scale</span>
        <select onchange="state.radius.scaleType=this.value; updateRadiusPreview()">
          <option value="linear" ${state.radius.scaleType==='linear'?'selected':''}>Linear</option>
          <option value="geometric" ${state.radius.scaleType==='geometric'?'selected':''}>Geometric</option>
        </select>
      </label></div>
    </div>
    <div class="section-label">Preview <span style="text-transform:none; font-weight:400;">— squares shown at ${RADIUS_PREVIEW_SIZE}×${RADIUS_PREVIEW_SIZE}px</span></div>
    <div id="radius-preview"></div>
    ${sparkleButton('Publish radius variables', "publish('publish-radius')")}
    <div class="status" id="status-Radius"></div>
  `;
}
function radiusPreviewHTML(t){
  return t.radius.map((r,i)=>`
    <div style="display:inline-block; text-align:center; margin:0 12px 12px 0;">
      <div style="width:${RADIUS_PREVIEW_SIZE}px; height:${RADIUS_PREVIEW_SIZE}px; background:white; border:1.5px solid var(--line); border-radius:${r}px;"></div>
      <div style="font-size:9px; color:var(--muted); margin-top:4px;">r-${i+1} · ${r}px</div>
    </div>`).join('');
}
function updateRadiusPreview(){
  const el = document.getElementById('radius-preview');
  if(el) el.innerHTML = radiusPreviewHTML(computeTokens());
}

/* ============== Shadow tab ============== */
function shadowControlsHTML(){
  if(!state.shadow.enabled){
    return `
      <div class="checkbox-row"><input type="checkbox" onchange="state.shadow.enabled=this.checked; renderCurrentTab()"> <span class="field-label" style="margin:0;">Enable shadows</span></div>
      <div style="font-size:11px; color:var(--muted);">Shadows off — nothing will be published for this tab.</div>
    `;
  }
  return `
    <div class="checkbox-row"><input type="checkbox" checked onchange="state.shadow.enabled=this.checked; renderCurrentTab()"> <span class="field-label" style="margin:0;">Enable shadows</span></div>
    <div class="row">
      <div><label class="field"><span class="field-label">Steps</span><input type="number" value="${state.shadow.steps}" oninput="state.shadow.steps=parseInt(this.value)||1; updateShadowPreview()"></label></div>
      <div><label class="field"><span class="field-label">Intensity</span><input type="number" step="0.02" value="${state.shadow.intensity}" oninput="state.shadow.intensity=parseFloat(this.value); updateShadowPreview()"></label></div>
      <div><label class="field"><span class="field-label">Tint</span>
        <select onchange="state.shadow.tint=this.value; updateShadowPreview()">
          <option value="neutral" ${state.shadow.tint==='neutral'?'selected':''}>Neutral</option>
          <option value="primary" ${state.shadow.tint==='primary'?'selected':''}>Primary-tinted</option>
        </select>
      </label></div>
    </div>
    <div class="section-label">Preview</div>
    <div id="shadow-preview"></div>
    ${sparkleButton('Publish effect styles', "publish('publish-shadow')")}
    <div class="status" id="status-Shadow"></div>
  `;
}
function shadowPreviewHTML(t){
  return t.shadow.map((s,i)=>`
    <div style="display:inline-block; text-align:center; margin:0 16px 16px 0;">
      <div style="width:48px; height:48px; background:white; border-radius:10px; box-shadow:${s};"></div>
      <div style="font-size:9px; color:var(--muted); margin-top:8px;">shadow-${i+1}</div>
    </div>`).join('');
}
function updateShadowPreview(){
  const el = document.getElementById('shadow-preview');
  if(el) el.innerHTML = shadowPreviewHTML(computeTokens());
}

/* ============== Components tab ============== */
function componentsControlsHTML(){
  const card=(key,label,extra)=>`
    <div class="comp-card">
      <div class="comp-card-head"><input type="checkbox" ${state.components[key].include?'checked':''} onchange="state.components['${key}'].include=this.checked; renderCurrentTab()"> ${label}</div>
      ${extra||''}
    </div>`;
  return `
    <div style="font-size:11px; color:var(--muted); margin-bottom:12px;">Every included component publishes with its full state set (hover/focus/disabled/error where applicable).</div>
    ${card('button','Buttons', `<input type="text" value="${state.components.button.variants}" oninput="state.components.button.variants=this.value;">`)}
    ${card('input','Input fields')}
    ${card('toggle','Toggles')}
    ${card('checkbox','Checkboxes')}
    ${card('radio','Radios')}
    ${card('tabs','Tabs')}
    ${card('badge','Badges', `<input type="text" value="${state.components.badge.variants}" oninput="state.components.badge.variants=this.value;">`)}
    ${sparkleButton('Publish components to canvas', "publish('publish-components')")}
    <div class="status" id="status-Components"></div>
  `;
}

renderCurrentTab();

/* ============== messages from plugin main thread ============== */
onmessage = (event) => {
  const msg = event.data.pluginMessage;
  if(!msg) return;
  if(msg.type==='publish-done'){
    const tabName = msg.tab.charAt(0).toUpperCase()+msg.tab.slice(1);
    setStatus(tabName, 'Published to Figma ✓', 'ok');
  } else if(msg.type==='error'){
    setStatus(currentTab, 'Error: '+msg.message, 'err');
  }
};
</script>
</body>
</html>
